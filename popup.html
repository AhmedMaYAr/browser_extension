<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PubMed Article Explorer</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <span>PubMed Article Explorer</span>
    </div>
    <button id="openOptions" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <form id="searchForm" class="search-bar">
    <input
      id="searchInput"
      type="text"
      placeholder="Search by keyword, gene, disease, author…"
      autocomplete="off"
    />
    <select id="sortSelect" title="Sort by">
      <option value="relevance">Best match</option>
      <option value="date">Most recent</option>
    </select>
    <button type="submit" class="primary-btn">Search</button>
  </form>

  <div id="status" class="status" role="status"></div>

  <div id="results" class="results"></div>

  <div id="pager" class="pager" hidden>
    <button id="prevPage" class="ghost-btn">← Prev</button>
    <span id="pageInfo"></span>
    <button id="nextPage" class="ghost-btn">Next →</button>
  </div>

  <template id="resultTemplate">
    <article class="card">
      <header class="card-header">
        <h3 class="card-title"></h3>
        <button class="expand-btn" aria-expanded="false">Details ▾</button>
      </header>
      <p class="card-meta"></p>
      <div class="card-body" hidden>
        <div class="abstract-block">
          <h4>Abstract</h4>
          <p class="abstract-text loading">Loading abstract…</p>
        </div>

        <div class="report-block">
          <div class="report-head">
            <h4>Short report</h4>
            <button class="ai-report-btn ghost-btn" hidden>✨ AI report</button>
          </div>
          <div class="report-content"></div>
        </div>

        <div class="related-block">
          <h4>Related articles</h4>
          <ul class="related-list loading-list"><li>Finding related articles…</li></ul>
        </div>

        <a class="pubmed-link" target="_blank" rel="noopener">View on PubMed ↗</a>
      </div>
    </article>
  </template>

  <script src="popup.js" type="module"></script>
</body>
</html>
